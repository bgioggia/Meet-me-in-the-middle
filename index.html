<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Me in the Middle</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>Meet Me in the Middle</h1>
            <p class="tagline">Find the perfect spot between two locations</p>
        </header>

        <!-- Location Input Section -->
        <section class="input-section">
            <div class="location-inputs">
                <div class="input-group">
                    <label for="location1">
                        <span class="marker marker-a">A</span>
                        First Location
                    </label>
                    <input type="text" id="location1" placeholder="Enter address or place name" autocomplete="off">
                    <div class="suggestions" id="suggestions1"></div>
                </div>

                <div class="input-group">
                    <label for="location2">
                        <span class="marker marker-b">B</span>
                        Second Location
                    </label>
                    <input type="text" id="location2" placeholder="Enter address or place name" autocomplete="off">
                    <div class="suggestions" id="suggestions2"></div>
                </div>
            </div>

            <div class="category-section">
                <label>What are you looking for?</label>
                <div class="category-buttons">
                    <button class="category-btn active" data-category="restaurant">
                        <span class="icon">🍽️</span>
                        Restaurants
                    </button>
                    <button class="category-btn" data-category="cafe">
                        <span class="icon">☕</span>
                        Cafes
                    </button>
                    <button class="category-btn" data-category="bar">
                        <span class="icon">🍺</span>
                        Bars
                    </button>
                    <button class="category-btn" data-category="fast_food">
                        <span class="icon">🍔</span>
                        Fast Food
                    </button>
                </div>
            </div>

            <button id="findMiddle" class="find-btn" disabled>
                <span class="btn-text">Find Meeting Spots</span>
                <span class="btn-loading" style="display: none;">
                    <span class="spinner"></span>
                    Searching...
                </span>
            </button>
        </section>

        <!-- View Toggle -->
        <div class="view-toggle" style="display: none;">
            <button class="toggle-btn active" data-view="map">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
                Map View
            </button>
            <button class="toggle-btn" data-view="list">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                List View
            </button>
        </div>

        <!-- Results Section -->
        <section class="results-section" style="display: none;">
            <!-- Map View -->
            <div id="mapView" class="view-container active">
                <div id="map"></div>
            </div>

            <!-- List View -->
            <div id="listView" class="view-container">
                <div class="results-header">
                    <h2>Meeting Spots</h2>
                    <span class="results-count"></span>
                </div>
                <div id="resultsList" class="results-list"></div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by <a href="https://www.openstreetmap.org/" target="_blank">OpenStreetMap</a> & <a href="https://leafletjs.com/" target="_blank">Leaflet</a></p>
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
